# Optional: expose read-only routing data through MCP Toolbox for Databases
# (https://github.com/googleapis/genai-toolbox), e.g. for Antigravity's MCP panel or an ADK
# ToolboxToolset. Field names follow the toolbox "sources/tools/toolsets" format; check them
# against the toolbox version you install.
sources:
  mclane-alloydb:
    kind: alloydb-postgres
    project: ${GOOGLE_CLOUD_PROJECT}
    region: us-central1
    cluster: mclane
    instance: mclane-primary
    database: mclane
    user: ${PG_USER}
    password: ${PG_PASSWORD}
  mclane-bigquery:
    kind: bigquery
    project: ${GOOGLE_CLOUD_PROJECT}

tools:
  open-orders-for-dc-date:
    kind: postgres-sql
    source: mclane-alloydb
    description: Open delivery orders for a DC and date with customer window and temperature mix.
    parameters:
      - name: dc_id
        type: string
        description: Distribution center id, e.g. DC-TEMPLE-TX
      - name: delivery_date
        type: string
        description: YYYY-MM-DD
    statement: |
      SELECT o.order_id, o.customer_id, c.name, o.dry_cases, o.chill_cases, o.frozen_cases, o.priority,
             c.window_start_min, c.window_end_min
      FROM mclane_routing.orders o JOIN mclane_routing.customers c ON o.customer_id = c.customer_id
      WHERE o.dc_id = $1 AND o.delivery_date = $2::date
      ORDER BY o.order_id;

  pending-escalations:
    kind: postgres-sql
    source: mclane-alloydb
    description: Re-plans waiting for dispatcher approval.
    statement: |
      SELECT a.action_id, a.event_id, a.cost_impact_usd, a.late_stops_after, a.escalation_reasons
      FROM mclane_routing.event_actions a
      LEFT JOIN mclane_routing.replan_approvals p ON p.action_id = a.action_id
      WHERE a.status = 'PENDING_APPROVAL' AND p.action_id IS NULL;

  savings-by-dc:
    kind: bigquery-sql
    source: mclane-bigquery
    description: Optimized versus TMW static cost per DC for a date (latest BASE plan).
    parameters:
      - name: route_date
        type: string
        description: YYYY-MM-DD
    statement: |
      SELECT dc_id, ARRAY_AGG(STRUCT(plan_id, total_cost_usd, baseline_cost_usd) ORDER BY created_at DESC LIMIT 1)[OFFSET(0)] AS latest
      FROM `mclane_routing.optimization_runs`
      WHERE route_date = DATE(@route_date) AND scenario = 'BASE'
      GROUP BY dc_id;

toolsets:
  route-optimization:
    - open-orders-for-dc-date
    - pending-escalations
    - savings-by-dc
